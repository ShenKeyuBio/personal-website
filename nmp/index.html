<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Private presentation</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#243138;background:white}main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px}form{width:min(400px,100%)}h1{font-size:30px;font-weight:500;margin:0 0 28px}label{display:block;font-size:18px;margin-bottom:10px}input,button{font:inherit;font-size:20px;width:100%;border:1px solid #bcc8cd;border-radius:0;padding:14px;min-height:50px}button{margin-top:16px;background:#243138;color:white;cursor:pointer}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:3px solid #177b86;outline-offset:3px}p{font-size:16px;line-height:1.5;color:#67777f}#status{min-height:48px}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:white}iframe[hidden]{display:none}</style></head><body><main id="gate"><form id="unlock"><h1>Private presentation</h1><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Unlock</button><p id="status" role="status">Enter the presentation password.</p><p>The password is required again when this presentation is closed.</p></form></main><iframe id="presentation" title="Scientific poster presentation" allow="fullscreen" hidden></iframe><script src="gate.js"></script></body></html>
